[package]
name = "manplay"
version = "0.1.0"
description = "Music library manager"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "manplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
lofty = "0.25.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
walkdir = "2.5.0"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
tokio = { version = "1.54.1", features = ["fs"] }
roxmltree = "0.21.2"
percent-encoding = "2.3.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
