[package]
name = "manplay"
version = "0.1.0"
description = "Music library manager"
authors = ["Mario Igkiempor"]
license = ""
repository = "https://github.com/MariosIgkiempor/manplay"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "manplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
lofty = "0.25.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
walkdir = "2.5.0"
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
tokio = { version = "1.54.1", features = ["fs"] }
roxmltree = "0.21.2"
percent-encoding = "2.3.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
blake3 = "1.8.7"
trash = "5.3.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
hmac = "0.13.0"
sha2 = "0.11.1"
keyring = { version = "3", features = ["apple-native"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
